services:
  api:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - embedded_copilot.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - web/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      EMBEDDED_COPILOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
